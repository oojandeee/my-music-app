name: my_music_app
description: A customizable music streaming app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audio_service: ^0.18.15
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon_splash.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon_splash.png"

flutter:
  uses-material-design: true
  assets:
    - sample_track_1.mp3
    - taylor_swift.mp3
