name: my_music_app
description: Customizable Flutter music streaming application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.5.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - sample_track_1.mp3
    - taylor_swift.mp3
